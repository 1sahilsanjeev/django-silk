[metadata]
name = your-django-app
version = 1.0.0
description = A reusable Django app with Django 6 support
long_description = file: README.md
long_description_content_type = text/markdown
url = https://example.com/your-django-app
author = Your Name
author_email = your.email@example.com
license = MIT
license_files = LICENSE
keywords = django, django6, web, app
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Topic :: Software Development :: Libraries :: Python Modules
    Framework :: Django
    Framework :: Django :: 4
    Framework :: Django :: 5
    Framework :: Django :: 6
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
project_urls =
    Documentation = https://example.com/your-django-app/docs
    Source = https://github.com/your-org/your-django-app
    Tracker = https://github.com/your-org/your-django-app/issues

[options]
packages = find:
include_package_data = True
zip_safe = False
python_requires = >=3.10
install_requires =
    Django>=4.2,<7.0

[options.packages.find]
exclude =
    tests
    tests.*
    docs
    docs.*
    examples
    examples.*

[options.extras_require]
dev =
    black>=24.0.0
    isort>=5.12.0
    flake8>=6.1.0
    mypy>=1.10.0
    pytest>=7.4.0
    pytest-django>=4.5.2
    pytest-cov>=5.0.0
    coverage[toml]>=7.5.0
    factory_boy>=3.3.0
    freezegun>=1.4.0
    pre-commit>=3.7.0
test =
    pytest>=7.4.0
    pytest-django>=4.5.2
    pytest-cov>=5.0.0
    coverage[toml]>=7.5.0
docs =
    sphinx>=7.3.0
    sphinx-rtd-theme>=2.0.0

[bdist_wheel]
universal = 0

[aliases]
test = pytest

[tool:pytest]
addopts = -ra -q --strict-config --strict-markers
testpaths =
    tests
python_files = tests.py test_*.py *_tests.py
markers =
    unit: Unit tests.
    integration: Integration tests.
    django_db: Tests that require database access.
django_find_project = true

[coverage:run]
branch = True
parallel = True
source =
    .
omit =
    */migrations/*
    */tests/*
    setup.py
    */.venv/*
    */venv/*
    */.tox/*
    */build/*
    */dist/*

[coverage:report]
show_missing = True
skip_covered = True
precision = 1
fail_under = 90
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    if __name__ == .__main__.:

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .tox,
    .venv,
    venv,
    migrations,
    docs/conf.py
per-file-ignores =
    */__init__.py: F401
max-complexity = 12
select = B,C,E,F,W,T4,B9

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
line_length = 88
known_first_party = your_django_app
known_third_party = django

[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
strict_optional = True
no_implicit_optional = True
pretty = True
show_error_codes = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
follow_imports = normal
exclude = (?x)(
    ^build/|
    ^dist/|
    ^docs/|
    ^tests/|
    migrations/
)